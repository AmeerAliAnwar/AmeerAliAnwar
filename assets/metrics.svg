<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="100%" height="100%">
  <defs>
    <linearGradient id="metric-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111726" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
  </defs>

  <style>
    .val { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 26px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
    .val-cyan { fill: #38bdf8; }
    .val-emerald { fill: #34d399; }
    .val-purple { fill: #a78bfa; }
    .val-amber { fill: #fbbf24; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #64748b; }
    .card-border { stroke: #1e293b; stroke-width: 1.2; rx: 6px; fill: url(#metric-bg); }
  </style>

  <g transform="translate(0, 0)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="211" height="120" class="card-border" />
      <rect x="0" y="0" width="211" height="2" fill="#38bdf8" rx="1" />
      <text x="18" y="42" class="val val-cyan">4x - 10x</text>
      <text x="18" y="68" class="label">Cost Reduction</text>
      <text x="18" y="88" class="sub">Cloud footprint optimization</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(223, 0)">
      <rect width="211" height="120" class="card-border" />
      <rect x="0" y="0" width="211" height="2" fill="#34d399" rx="1" />
      <text x="18" y="42" class="val val-emerald">0.018ms</text>
      <text x="18" y="68" class="label">Search Latency</text>
      <text x="18" y="88" class="sub">C++ Hierarchical B+ Tree</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(446, 0)">
      <rect width="211" height="120" class="card-border" />
      <rect x="0" y="0" width="211" height="2" fill="#a78bfa" rx="1" />
      <text x="18" y="42" class="val val-purple">2.7B+</text>
      <text x="18" y="68" class="label">Monthly Tokens</text>
      <text x="18" y="88" class="sub">Multi-LLM proxy routing</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(669, 0)">
      <rect width="211" height="120" class="card-border" />
      <rect x="0" y="0" width="211" height="2" fill="#fbbf24" rx="1" />
      <text x="18" y="42" class="val val-amber">O(d)</text>
      <text x="18" y="68" class="label">Query Complexity</text>
      <text x="18" y="88" class="sub">Slashed from linear O(N)</text>
    </g>
  </g>
</svg>
