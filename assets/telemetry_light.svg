    <rect width="196" height="166" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    
    <!-- Tag & Lang -->
    <text x="14" y="22" class="mono" font-size="9" font-weight="700" fill="#0969da" letter-spacing="0.8">INFRASTRUCTURE</text>
    <text x="182" y="22" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#656d76">Docker / Pg</text>
    
    <!-- Main Title -->
    <text x="14" y="48" class="sans" font-size="14" font-weight="700" fill="#1f2328">Cloud Optimizer</text>
    
    <!-- Primary Metric -->
    <text x="14" y="82" class="mono" font-size="20" font-weight="800" fill="#1f2328">4x to 10x</text>
    
    <!-- Subtitle Detail -->
    <text x="14" y="106" class="sans" font-size="10.5" font-weight="500" fill="#656d76">Compute & Memory Cuts</text>
    
    <!-- Animated Progress Track -->
    <rect x="14" y="132" width="168" height="5" rx="2.5" fill="#eaeef2" />
    <rect x="14" y="132" width="151.20000000000002" height="5" rx="2.5" fill="#1a7f37" class="live-pulse" />
