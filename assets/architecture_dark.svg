<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      @keyframes packet-flow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .wire-packet { stroke-dasharray: 4, 4; animation: packet-flow 1.5s linear infinite; }
    </style>
  </defs>
  <rect x="1" y="1" width="878" height="268" rx="8" fill="none" stroke="#30363d" stroke-width="1" />
  <g transform="translate(20, 24)">
    <text class="sans" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">RUNTIME ARCHITECTURE // AUTONOMOUS AGENT CDP ORCHESTRATION</text>
  </g>
  <line x1="20" y1="36" x2="860" y2="36" stroke="#30363d" stroke-width="0.8" />
  <!-- Block 1: Agent Client -->
  <g transform="translate(20, 52)">
    <rect width="194" height="196" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <rect x="14" y="12" width="68" height="18" rx="3" fill="#1f6feb" fill-opacity="0.18" />
    <text x="48" y="24" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#58a6ff">CLIENT</text>
    <text x="14" y="52" class="sans" font-size="14" font-weight="700" fill="#f0f6fc">Agent Client</text>
    <text x="14" y="68" class="sans" font-size="10.5" font-weight="500" fill="#8b949e">Autonomous LLM loops</text>
    <line x1="14" y1="82" x2="180" y2="82" stroke="#21262d" stroke-width="0.8" />
    <text x="14" y="104" class="mono" font-size="9" fill="#8b949e">* Protocol: MCP / stdio</text>
    <text x="14" y="126" class="mono" font-size="9" fill="#8b949e">* Tooling: chrome_use_*</text>
    <text x="14" y="148" class="mono" font-size="9" fill="#8b949e">* JSON-RPC 2.0 Dispatch</text>
  </g>
  <!-- Connector 1 -> 2 -->
  <line x1="214" y1="120" x2="238" y2="120" stroke="#388bfd" stroke-width="1.2" class="wire-packet" />
  <!-- Block 2: chrome-use Core -->
  <g transform="translate(238, 52)">
    <rect width="194" height="196" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <rect x="14" y="12" width="68" height="18" rx="3" fill="#1f6feb" fill-opacity="0.18" />
    <text x="48" y="24" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#58a6ff">RUST CORE</text>
    <text x="14" y="52" class="sans" font-size="14" font-weight="700" fill="#f0f6fc">chrome-use Core</text>
    <text x="14" y="68" class="sans" font-size="10.5" font-weight="500" fill="#8b949e">Tokio async engine</text>
    <line x1="14" y1="82" x2="180" y2="82" stroke="#21262d" stroke-width="0.8" />
    <text x="14" y="104" class="mono" font-size="9" fill="#8b949e">* Process-Level Tab Router</text>
    <text x="14" y="126" class="mono" font-size="9" fill="#8b949e">* Zero-Alloc State Buffer</text>
    <text x="14" y="148" class="mono" font-size="9" fill="#8b949e">* Batch Action Pipeline</text>
  </g>
  <!-- Connector 2 -> 3 -->
  <line x1="432" y1="120" x2="456" y2="120" stroke="#388bfd" stroke-width="1.2" class="wire-packet" />
  <!-- Block 3: Native Host -->
  <g transform="translate(456, 52)">
    <rect width="194" height="196" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <rect x="14" y="12" width="68" height="18" rx="3" fill="#1f6feb" fill-opacity="0.18" />
    <text x="48" y="24" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#58a6ff">RELAY</text>
    <text x="14" y="52" class="sans" font-size="14" font-weight="700" fill="#f0f6fc">Native Host</text>
    <text x="14" y="68" class="sans" font-size="10.5" font-weight="500" fill="#8b949e">Extension bridge</text>
    <line x1="14" y1="82" x2="180" y2="82" stroke="#21262d" stroke-width="0.8" />
    <text x="14" y="104" class="mono" font-size="9" fill="#8b949e">* Stdio Frame Protocol</text>
    <text x="14" y="126" class="mono" font-size="9" fill="#8b949e">* Port Multiplexer</text>
    <text x="14" y="148" class="mono" font-size="9" fill="#8b949e">* Localhost:55866</text>
  </g>
  <!-- Connector 3 -> 4 -->
  <line x1="650" y1="120" x2="674" y2="120" stroke="#388bfd" stroke-width="1.2" class="wire-packet" />
  <!-- Block 4: Chrome Runtime -->
  <g transform="translate(674, 52)">
    <rect width="194" height="196" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <rect x="14" y="12" width="68" height="18" rx="3" fill="#1f6feb" fill-opacity="0.18" />
    <text x="48" y="24" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#58a6ff">TARGET</text>
    <text x="14" y="52" class="sans" font-size="14" font-weight="700" fill="#f0f6fc">Chrome Runtime</text>
    <text x="14" y="68" class="sans" font-size="10.5" font-weight="500" fill="#8b949e">Isolated tab sessions</text>
    <line x1="14" y1="82" x2="180" y2="82" stroke="#21262d" stroke-width="0.8" />
    <text x="14" y="104" class="mono" font-size="9" fill="#8b949e">* DOM / A11y Tree Parse</text>
    <text x="14" y="126" class="mono" font-size="9" fill="#8b949e">* Base64 Direct Capture</text>
    <text x="14" y="148" class="mono" font-size="9" fill="#8b949e">* Raw CDP WebSocket</text>
  </g>
</svg>