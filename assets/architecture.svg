<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #8b949e; letter-spacing: 1.2px; text-transform: uppercase; }
    .box-title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #f0f6fc; }
    .box-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #a5b0bd; }
    .tag { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #58a6ff; font-weight: 600; }
    .wire-active { stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 4, 3; fill: none; }
    .card { fill: url(#grad-card); stroke: #30363d; stroke-width: 1; rx: 6px; }
  </style>

  <rect width="880" height="280" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <text x="24" y="32" class="title">RUNTIME ARCHITECTURE: AUTONOMOUS AGENT CDP ORCHESTRATION</text>
  <line x1="24" y1="44" x2="856" y2="44" stroke="#21262d" stroke-width="1" />

  <g transform="translate(24, 64)">
    <rect width="180" height="184" class="card" />
    <rect x="12" y="12" width="60" height="18" rx="3" fill="#1f6feb" fill-opacity="0.18" />
    <text x="18" y="25" class="tag">CLIENT</text>
    <text x="12" y="54" class="box-title">Agent Client</text>
    <text x="12" y="74" class="box-subtitle">Autonomous LLM loops</text>
    <line x1="12" y1="92" x2="168" y2="92" stroke="#21262d" stroke-width="1" />
    <text x="12" y="114" class="box-subtitle">Protocol: MCP / stdio</text>
    <text x="12" y="134" class="box-subtitle">Tooling: chrome_use_*</text>
    <text x="12" y="154" class="box-subtitle">Async command dispatch</text>
    <text x="12" y="174" class="tag">JSON-RPC 2.0</text>
  </g>

  <g transform="translate(240, 64)">
    <rect width="190" height="184" class="card" stroke="#388bfd" stroke-width="1.2" />
    <rect x="12" y="12" width="56" height="18" rx="3" fill="#238636" fill-opacity="0.18" />
    <text x="18" y="25" class="tag" fill="#3fb950">RUST</text>
    <text x="12" y="54" class="box-title">chrome-use Core</text>
    <text x="12" y="74" class="box-subtitle">Tokio async engine</text>
    <line x1="12" y1="92" x2="178" y2="92" stroke="#21262d" stroke-width="1" />
    <text x="12" y="114" class="box-subtitle">Native browser manager</text>
    <text x="12" y="134" class="box-subtitle">Multi-tab context router</text>
    <text x="12" y="154" class="box-subtitle">Target discovery &amp; state</text>
    <text x="12" y="174" class="tag">Zero-alloc buffer</text>
  </g>

  <g transform="translate(466, 64)">
    <rect width="180" height="184" class="card" />
    <rect x="12" y="12" width="52" height="18" rx="3" fill="#a371f7" fill-opacity="0.18" />
    <text x="18" y="25" class="tag" fill="#bc8cff">RELAY</text>
    <text x="12" y="54" class="box-title">Native Host</text>
    <text x="12" y="74" class="box-subtitle">Extension bridge</text>
    <line x1="12" y1="92" x2="168" y2="92" stroke="#21262d" stroke-width="1" />
    <text x="12" y="114" class="box-subtitle">Stdio frame protocol</text>
    <text x="12" y="134" class="box-subtitle">Port multiplexer</text>
    <text x="12" y="154" class="box-subtitle">WebSocket listener</text>
    <text x="12" y="174" class="tag">Localhost :55866</text>
  </g>

  <g transform="translate(682, 64)">
    <rect width="174" height="184" class="card" />
    <rect x="12" y="12" width="62" height="18" rx="3" fill="#f0883e" fill-opacity="0.18" />
    <text x="18" y="25" class="tag" fill="#f0883e">TARGET</text>
    <text x="12" y="54" class="box-title">Chrome Runtime</text>
    <text x="12" y="74" class="box-subtitle">Isolated tab sessions</text>
    <line x1="12" y1="92" x2="162" y2="92" stroke="#21262d" stroke-width="1" />
    <text x="12" y="114" class="box-subtitle">Tab 1: Target session A</text>
    <text x="12" y="134" class="box-subtitle">Tab 2: Target session B</text>
    <text x="12" y="154" class="box-subtitle">DOM / A11y tree parse</text>
    <text x="12" y="174" class="tag">Raw CDP WebSocket</text>
  </g>

  <line x1="204" y1="156" x2="238" y2="156" class="wire-active" marker-end="url(#arrow)" />
  <line x1="430" y1="156" x2="464" y2="156" class="wire-active" marker-end="url(#arrow)" />
  <line x1="646" y1="156" x2="680" y2="156" class="wire-active" marker-end="url(#arrow)" />
</svg>
