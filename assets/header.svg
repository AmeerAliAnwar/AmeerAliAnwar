<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <pattern id="grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
    .role { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #38bdf8; letter-spacing: 0.5px; }
    .bio { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #94a3b8; line-height: 1.5; }
    .chip-bg { fill: #1e293b; fill-opacity: 0.6; stroke: #334155; stroke-width: 0.8; rx: 4px; }
    .chip-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #cbd5e1; }
    .node-wire { stroke: #38bdf8; stroke-opacity: 0.35; stroke-width: 1; fill: none; }
    .node-dot { fill: #38bdf8; }
  </style>

  <!-- Base Card -->
  <rect width="880" height="200" rx="8" fill="url(#header-bg)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="880" height="200" rx="8" fill="url(#grid-pattern)" />

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="880" height="3" fill="url(#accent-line)" rx="1.5" />

  <!-- Content Group -->
  <g transform="translate(36, 42)">
    <text x="0" y="0" class="role">SYSTEMS ARCHITECT &amp; AI PRODUCT ENGINEER</text>
    <text x="0" y="36" class="name">Ameer Ali Anwar</text>
    <text x="0" y="66" class="bio">Building sub-millisecond C++ algorithms, autonomous agent runtimes (CDP),</text>
    <text x="0" y="86" class="bio">and reducing enterprise cloud deployment footprints by 4x to 10x.</text>

    <!-- Chips Row -->
    <g transform="translate(0, 108)">
      <g transform="translate(0, 0)">
        <rect width="48" height="22" class="chip-bg" />
        <text x="10" y="15" class="chip-text" fill="#38bdf8">C++</text>
      </g>
      <g transform="translate(56, 0)">
        <rect width="66" height="22" class="chip-bg" />
        <text x="10" y="15" class="chip-text">Python</text>
      </g>
      <g transform="translate(130, 0)">
        <rect width="52" height="22" class="chip-bg" />
        <text x="10" y="15" class="chip-text">Rust</text>
      </g>
      <g transform="translate(190, 0)">
        <rect width="108" height="22" class="chip-bg" />
        <text x="10" y="15" class="chip-text">Tokio &amp; CDP</text>
      </g>
      <g transform="translate(306, 0)">
        <rect width="136" height="22" class="chip-bg" />
        <text x="10" y="15" class="chip-text">4x-10x Cost Cuts</text>
      </g>
      <g transform="translate(450, 0)">
        <rect width="146" height="22" class="chip-bg" />
        <text x="10" y="15" class="chip-text">0.018ms B+ Search</text>
      </g>
    </g>
  </g>

  <!-- Right Geometric Systems Illustration -->
  <g transform="translate(680, 24)">
    <circle cx="100" cy="76" r="54" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="100" cy="76" r="36" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3" />
    <circle cx="100" cy="76" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="100" cy="76" r="5" fill="#38bdf8" />

    <!-- Satellite Nodes -->
    <path d="M 100 22 L 100 60" class="node-wire" />
    <circle cx="100" cy="22" r="3.5" class="node-dot" />
    
    <path d="M 100 130 L 100 92" class="node-wire" />
    <circle cx="100" cy="130" r="3.5" class="node-dot" />

    <path d="M 46 76 L 84 76" class="node-wire" />
    <circle cx="46" cy="76" r="3.5" class="node-dot" />

    <path d="M 154 76 L 116 76" class="node-wire" />
    <circle cx="154" cy="76" r="3.5" class="node-dot" />

    <!-- Isometric trace corners -->
    <path d="M 62 38 L 84 60" class="node-wire" />
    <circle cx="62" cy="38" r="2.5" class="node-dot" />

    <path d="M 138 114 L 116 92" class="node-wire" />
    <circle cx="138" cy="114" r="2.5" class="node-dot" />
  </g>
</svg>
